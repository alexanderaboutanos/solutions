name: Generate index

on:
  push:
    branches: [main]
    paths:
      - "metadata.json"
      - "problems/**"
      - "scripts/generate.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate README index
        run: python scripts/generate.py

      - name: Commit regenerated index
        run: |
          if ! git diff --quiet README.md; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: regenerate index [skip ci]"
            git push
          else
            echo "README.md already up to date."
          fi
